apiVersion: apps/v1
kind: Deployment
metadata:
  name: westos-frontend
  namespace: westos
  labels:
    app: westos-frontend
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: westos-frontend
  template:
    metadata:
      labels:
        app: westos-frontend
        version: v1
    spec:
      containers:
        - name: frontend
          image: westos/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: westos-frontend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: westos-frontend
  namespace: westos
  labels:
    app: westos-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: westos-frontend