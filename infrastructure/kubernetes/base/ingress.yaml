apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: westos-ingress
  namespace: westos
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.westos.com
        - www.westos.com
      secretName: westos-tls
  rules:
    - host: api.westos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: westos-backend
                port:
                  number: 3001
    - host: www.westos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: westos-frontend
                port:
                  number: 3000